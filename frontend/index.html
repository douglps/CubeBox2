<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2306b6d4'><path d='M21 16.5l-9 5.2-9-5.2V7.5l9-5.2 9 5.2v9zM12 4.2L5.2 8.1 12 12l6.8-3.9L12 4.2zM4.5 9.7v5.8l6.5 3.7V13.5L4.5 9.7zm8.5 9.5l6.5-3.7V9.7L13 13.5v5.7z'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CubeBox — Cockpit Operacional de Estoque Multi-Warehouse, Análise Preditiva e Frente de Caixa Balcão Expressa (POS)." />
    <title>CubeBox — Cockpit Operacional & Preditivo</title>
    <!-- Google Fonts: Instrument Serif, Geist, Geist Mono, Inter, JetBrains Mono, DM Sans, Plus Jakarta Sans, Space Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=Geist+Mono:wght@400;500;600;700&family=Geist:wght@300;400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root">
      <div id="cubebox-splash" style="
        height: 100vh;
        width: 100vw;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #090d16;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        user-select: none;
      ">
        <style>
          @keyframes splashPulse {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.05); opacity: 1; }
          }
          @keyframes splashBar {
            0% { transform: translateX(-100%); }
            50% { transform: translateX(50%); }
            100% { transform: translateX(200%); }
          }
        </style>
        <div style="animation: splashPulse 2s ease-in-out infinite; display: flex; flex-direction: column; align-items: center;">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="#06b6d4" style="filter: drop-shadow(0 0 12px rgba(6, 182, 212, 0.4));">
            <path d="M21 16.5l-9 5.2-9-5.2V7.5l9-5.2 9 5.2v9zM12 4.2L5.2 8.1 12 12l6.8-3.9L12 4.2zM4.5 9.7v5.8l6.5 3.7V13.5L4.5 9.7zm8.5 9.5l6.5-3.7V9.7L13 13.5v5.7z"/>
          </svg>
          <div style="margin-top: 20px; font-size: 15px; font-weight: 700; letter-spacing: 0.12em; color: #f8fafc;">
            CUBEBOX ENTERPRISE
          </div>
          <div style="margin-top: 6px; font-size: 12px; color: #64748b; font-weight: 500;">
            Inicializando Cockpit Operacional...
          </div>
        </div>
        <div style="margin-top: 28px; width: 140px; height: 3px; background: rgba(255, 255, 255, 0.08); border-radius: 99px; overflow: hidden; position: relative;">
          <div style="width: 50%; height: 100%; background: #06b6d4; border-radius: 99px; animation: splashBar 1.4s infinite cubic-bezier(0.4, 0, 0.2, 1);"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
